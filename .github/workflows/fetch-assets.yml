name: Fetch generated assets
# Relay: this container's egress policy blocks the Higgsfield CDN, but GitHub
# Actions runners have open egress. The workflow downloads every asset listed
# in dating-shorts-empire/.asset-manifest.json and commits the files back to
# the branch, where the session pulls them.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets from manifest
        run: |
          set -e
          manifest="dating-shorts-empire/.asset-manifest.json"
          [ -f "$manifest" ] || { echo "no manifest"; exit 0; }
          count=$(jq length "$manifest")
          echo "Fetching $count assets"
          for i in $(seq 0 $((count-1))); do
            url=$(jq -r ".[$i].url" "$manifest")
            path=$(jq -r ".[$i].path" "$manifest")
            if [ -s "$path" ]; then echo "skip (exists): $path"; continue; fi
            mkdir -p "$(dirname "$path")"
            echo "GET $url -> $path"
            curl -sSL --retry 3 --retry-delay 2 -o "$path" "$url"
            ls -la "$path"
          done
      - name: Commit and push
        run: |
          git config user.name "asset-relay[bot]"
          git config user.email "asset-relay@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Asset relay: fetch generated media"
          git push
